[project]
name = "mymoviegallery-backend"
version = "1.0.0"
description = "Production-ready backend for MyMovieGallery — AI-powered personal movie gallery"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
